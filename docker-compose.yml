services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.docker
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file:
      - .env.docker
    ports:
      - "8010:8010"
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
    working_dir: /var/www/html
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
